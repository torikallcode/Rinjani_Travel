name: CI

on:
  push:
    branches: [master, chore/finishing]
  pull_request:
    branches: [master, chore/finishing]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rinjani_travel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...
      - name: Run go tests
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: rinjani_travel_test
          SERVER_ENV: testing
          JWT_SECRET: test-secret-do-not-use-in-production
          PAYMENT_GATEWAY_SECRET: test-secret
          ALLOWED_ORIGINS: http://localhost:5173
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run lint
        working-directory: ./frontend
        run: npm run lint
      - name: Run build
        working-directory: ./frontend
        run: npm run build
      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./